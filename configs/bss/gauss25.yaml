task_name: gauss25
train_url: ../exp/BSS # will join with task name in the phase option

device: 'cuda:0' # 'cuda:0' or 'cpu'

description: BSS Gaussian sigma=25

resume: 
  path:  
    teacher1:  [anchor,./exp/nsc-bsm/gauss25/ckpts/56.pth]
    backbone:  [anchor,./exp/nsc-bsm/gauss25/ckpts/56.pth]
 
  strict: true
  resume_optim: false # 是否resume优化器

datasets:
  train:
    type: ImagenetValDataset # the name of dataset class
    data_dir: ./datasets/train/Imagenet_val
    patch: 128
    batch_size: 4
    
  # may validate during training
  validate:
    type: BasicValidateDataset
    # use kodak as default
    data_dir: ./datasets/test/Kodak24
    

  # only work in testing
  test:
    type: BasicValidateDataset
    # use kodak as default
    data_dir: ./datasets/test/Kodak24




models:
  model_files:
    - main_model.teacher
    - backbone.unet
    - module.noiser
  
  main_model: 
    type: OneTeacher_TwoBranch


  sub_models:
    teacher1:
      type: UNet
      in_channels: 3
      out_channels: 3
      depth: 5
      wf: 48
      slope: 0.1

    backbone:
      type: UNet
      in_channels: 3
      out_channels: 3
      depth: 5
      wf: 48
      slope: 0.1

    noiser:
      type: GauPos_Noiser
      style: gauss25



train:
  mode: v4_stdmask
  
  total_epoch: 60
  optim_models: [backbone]
  save_freq: 1
  print_freq: 100


  optimizer:
    type: Adam
    lr: !!float 7.5e-5
    weight_decay: !!float 1e-8

  scheduler: 
    milestones: [20,40]
    gamma: 0.5

  loss_params:
    thres: 5
    ws: 7

val:
  is_val: true # a flag for validate during training  
  repeat_times: 10
  val_freq: 1
  save_results: false

test:
  repeat_times: 10
  save_results: true
