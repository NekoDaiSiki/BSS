# NSC-BSM Poisson 30: the same continuous schedule as gauss25.
task_name: poi30
train_url: ./exp/nsc-bsm
device: cuda:0
description: 'NSC-BSM Poisson 30, epochs 0-39 and 40-59'

resume:
  path: null
  strict: true
  resume_optim: true

datasets:
  train:
    type: ImagenetValDataset
    data_dir: ./datasets/train/Imagenet_val
    patch: 128
    batch_size: 4
  validate:
    type: BasicValidateDataset
    data_dir: ./datasets/test/Kodak24
  test:
    type: BasicValidateDataset
    data_dir: ./datasets/test/BSD300

models:
  model_files:
    - main_model.freq_prior
    - backbone.unet
    - module.masker
    - module.noiser
  main_model:
    type: Frequency_B2UB_Model_SupStd_AnchorMomentum
    m: 0.999
  sub_models:
    anchor:
      type: UNet
      in_channels: 3
      out_channels: 3
      depth: 5
      wf: 48
      slope: 0.1
    backbone:
      type: UNet
      in_channels: 3
      out_channels: 3
      depth: 5
      wf: 48
      slope: 0.1
    noiser:
      type: GauPos_Noiser
      style: poisson30
    masker:
      type: b2ub_Masker
      width: 4
      mode: interpolate
      mask_type: all

train:
  total_epoch: 60
  optim_models: [backbone]
  save_freq: 1
  print_freq: 100
  # Gamma is 0 at epochs 0-39, then increases from 0.05 to 1 at epochs 40-59.
  mean_loss_stages:
    - start_epoch: 0
      end_epoch: 40
      weight: 0.0
      ws: 7
    - start_epoch: 40
      end_epoch: 60
      weight: 0.0
      weight_end: 1.0
      ws: 7
  optimizer:
    type: Adam
    lr: !!float 3e-4
    weight_decay: !!float 1e-8
  scheduler:
    milestones: [25, 35, 45, 55]
    gamma: 0.5
  clear_center: false
  loss_params:
    thread1: 40
    thread2: 60
    alpha: 1.0
    beta: 2
    increase_ratio: 20
    mode: freq_reg_soft_multiplier
    lower: 5
    mullower: 1
    upper: 30
    mulupper: 0
    mean_loss_params:
      weight: 0.0
      mean_ws: 3  # predicted-value neighborhood mean (k)
      ws: 7       # flat-region selection
      thres: 5

val:
  is_val: true
  repeat_times: 10
  val_freq: 1
  save_results: false

test:
  repeat_times: 3
  save_results: true
