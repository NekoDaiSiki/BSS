task_name: poi30
train_url: ../exp/BSS
device: cuda:0
description: 'BSS with a Poisson lambda=30 NSC-BSM separator'

resume:
  path:
    teacher1: [anchor, ./exp/nsc-bsm/poi30/ckpts/59.pth]
    backbone: [anchor, ./exp/nsc-bsm/poi30/ckpts/59.pth]
  strict: true
  resume_optim: false

datasets:
  train:
    type: ImagenetValDataset
    data_dir: ./datasets/train/Imagenet_val
    patch: 128
    batch_size: 4
  validate:
    type: BasicValidateDataset
    data_dir: ./datasets/test/Kodak24
  test:
    type: BasicValidateDataset
    data_dir: ./datasets/test/Kodak24

models:
  model_files:
    - main_model.teacher
    - backbone.unet
    - module.noiser
  main_model:
    type: OneTeacher_TwoBranch
  sub_models:
    teacher1:
      type: UNet
      in_channels: 3
      out_channels: 3
      depth: 5
      wf: 48
      slope: 0.1
    backbone:
      type: UNet
      in_channels: 3
      out_channels: 3
      depth: 5
      wf: 48
      slope: 0.1
    noiser:
      type: GauPos_Noiser
      style: poisson30

train:
  mode: v4_stdmask_poinorm
  total_epoch: 60
  optim_models: [backbone]
  save_freq: 1
  print_freq: 100
  optimizer:
    type: Adam
    lr: !!float 7.5e-5
    weight_decay: !!float 1e-8
  scheduler:
    milestones: [20, 40]
    gamma: 0.5
  loss_params:
    thres: 5
    ws: 7
    norm_type: poinorm
    norm_weight: 1

val:
  is_val: true
  repeat_times: 10
  val_freq: 1
  save_results: false

test:
  repeat_times: 10
  save_results: true
